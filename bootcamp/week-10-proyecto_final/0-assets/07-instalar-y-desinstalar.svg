<svg viewBox="0 0 820 450" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>El recorrido de install.sh. Desde la carpeta del repositorio, api-toolkit.sh se copia con install -m 755 a PREFIX/bin/api-toolkit, que por defecto es ~/.local/bin y no necesita sudo. Después, la copia instalada se ejecuta con --version para comprobar que arranca, y se avisa si PREFIX/bin no está en el PATH. uninstall borra solo ese archivo: ~/.bc-curl y la sesión OAuth2 se quedan, porque son del usuario. Aparte, tachado, curl URL | bash</title>
  <rect width="820" height="450" fill="#0d1117"/>
  <defs><marker id="f-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0d1117"/></marker><marker id="f-sf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#161b22"/></marker><marker id="f-bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#30363d"/></marker><marker id="f-tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0f6fc"/></marker><marker id="f-t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="f-na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="f-az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="f-az2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker><marker id="f-ve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="f-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="f-ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="f-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d2a8ff"/></marker></defs>
  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Instalar y desinstalar</text>
  <rect x="30" y="80" width="160" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="110" y="108" text-anchor="middle" fill="#8b949e" font-size="12">tu clon</text>
  <text x="110" y="130" text-anchor="middle" fill="#f0f6fc" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">api-toolkit.sh</text>
  <path d="M196 115 L276 115" stroke="#58a6ff" stroke-width="2.2" fill="none" marker-end="url(#f-az)"/>
  <text x="236" y="104" text-anchor="middle" fill="#58a6ff" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">install -m 755</text>
  <rect x="282" y="80" width="254" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="409" y="108" text-anchor="middle" fill="#58a6ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">PREFIX/bin/api-toolkit</text>
  <text x="409" y="130" text-anchor="middle" fill="#8b949e" font-size="11.5">por defecto ~/.local, sin sudo</text>
  <path d="M542 115 L600 115" stroke="#3fb950" stroke-width="2.2" fill="none" marker-end="url(#f-ve)"/>
  <rect x="606" y="80" width="190" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="701" y="108" text-anchor="middle" fill="#3fb950" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">api-toolkit --version</text>
  <text x="701" y="130" text-anchor="middle" fill="#8b949e" font-size="11.5">¿arranca? ¿está en el PATH?</text>
  <text x="110" y="186" text-anchor="middle" fill="#8b949e" font-size="11.5">el origen se busca al lado</text>
  <text x="110" y="203" text-anchor="middle" fill="#8b949e" font-size="11.5">de install.sh, no en el cwd</text>
  <text x="701" y="186" text-anchor="middle" fill="#8b949e" font-size="11.5">si no está en el PATH:</text>
  <text x="701" y="203" text-anchor="middle" fill="#8b949e" font-size="11.5">un aviso, no un error</text>
  <rect x="30" y="240" width="380" height="100" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.6"/>
  <text x="46" y="266" text-anchor="start" fill="#f85149" font-size="13" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">./install.sh uninstall</text>
  <text x="46" y="292" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">rm -f PREFIX/bin/api-toolkit</text>
  <text x="46" y="312" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">y nada más</text>
  <rect x="430" y="240" width="366" height="100" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.6"/>
  <text x="446" y="266" text-anchor="start" fill="#d2a8ff" font-size="13" font-weight="bold">Se quedan: son del usuario</text>
  <text x="446" y="292" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">~/.bc-curl</text>
  <text x="446" y="312" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">~/.bc-curl-session</text>
  <rect x="30" y="370" width="766" height="54" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="413" y="402" text-anchor="middle" fill="#f85149" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">curl -fsSL https://ejemplo.dev/install.sh | bash</text>
  <path d="M222 397 L604 397" stroke="#f85149" stroke-width="2.5"/>
</svg>
