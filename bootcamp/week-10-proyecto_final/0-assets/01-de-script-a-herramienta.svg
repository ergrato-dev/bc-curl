<svg viewBox="0 0 820 470" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Las cinco cosas que separan un script de una herramienta, alrededor de api-toolkit: se instala con un comando, se configura sin editar el código, explica su uso con --help y --version, se prueba con bats, y la CI ejecuta las pruebas en cada push. Debajo, el contrato que no cambia: stdout para los datos, stderr para los mensajes, y los códigos de salida 0, 1, 69, 75 y 77</title>
  <rect width="820" height="470" fill="#0d1117"/>
  <defs><marker id="f-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0d1117"/></marker><marker id="f-sf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#161b22"/></marker><marker id="f-bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#30363d"/></marker><marker id="f-tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0f6fc"/></marker><marker id="f-t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="f-na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="f-az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="f-az2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker><marker id="f-ve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="f-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="f-ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="f-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d2a8ff"/></marker></defs>
  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">De script a herramienta</text>
  <rect x="300" y="160" width="220" height="76" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2.5"/>
  <text x="410" y="192" text-anchor="middle" fill="#f0883e" font-size="17" font-weight="bold">api-toolkit 1.0.0</text>
  <text x="410" y="216" text-anchor="middle" fill="#8b949e" font-size="12.5">un solo archivo de bash</text>
  <rect x="40" y="64" width="200" height="58" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="140" y="88" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Se instala</text>
  <text x="140" y="108" text-anchor="middle" fill="#f0f6fc" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">./install.sh</text>
  <rect x="580" y="64" width="200" height="58" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="680" y="88" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="bold">Se configura</text>
  <text x="680" y="108" text-anchor="middle" fill="#f0f6fc" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">init y ~/.bc-curl</text>
  <rect x="40" y="270" width="200" height="58" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="140" y="294" text-anchor="middle" fill="#e3b341" font-size="14" font-weight="bold">Se explica</text>
  <text x="140" y="314" text-anchor="middle" fill="#f0f6fc" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">--help y --version</text>
  <rect x="580" y="270" width="200" height="58" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="680" y="294" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Se prueba</text>
  <text x="680" y="314" text-anchor="middle" fill="#f0f6fc" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">bats tests/</text>
  <rect x="310" y="288" width="200" height="58" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="410" y="312" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">Se vigila</text>
  <text x="410" y="332" text-anchor="middle" fill="#f0f6fc" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">la CI en cada push</text>
  <path d="M300 175 L240 120" stroke="#58a6ff" stroke-width="2.2" fill="none" marker-end="url(#f-az)"/>
  <path d="M520 175 L580 120" stroke="#d2a8ff" stroke-width="2.2" fill="none" marker-end="url(#f-mo)"/>
  <path d="M300 225 L240 280" stroke="#e3b341" stroke-width="2.2" fill="none" marker-end="url(#f-am)"/>
  <path d="M520 225 L580 280" stroke="#3fb950" stroke-width="2.2" fill="none" marker-end="url(#f-ve)"/>
  <path d="M410 236 L410 284" stroke="#f85149" stroke-width="2.2" fill="none" marker-end="url(#f-ro)"/>
  <text x="410" y="380" text-anchor="middle" fill="#8b949e" font-size="13">La interfaz: lo que no cambia sin cambiar la versión mayor</text>
  <rect x="40" y="396" width="170" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="125" y="418" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">stdout</text>
  <text x="125" y="437" text-anchor="middle" fill="#f0f6fc" font-size="12">solo los datos</text>
  <rect x="230" y="396" width="170" height="52" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
  <text x="315" y="418" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">stderr</text>
  <text x="315" y="437" text-anchor="middle" fill="#f0f6fc" font-size="12">mensajes y trazas</text>
  <rect x="420" y="396" width="170" height="52" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.6"/>
  <text x="505" y="418" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">entorno + ~/.bc-curl</text>
  <text x="505" y="437" text-anchor="middle" fill="#f0f6fc" font-size="12">configuración</text>
  <rect x="610" y="396" width="170" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="695" y="418" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">código de salida</text>
  <text x="695" y="437" text-anchor="middle" fill="#f0f6fc" font-size="12">0 · 1 · 69 · 75 · 77</text>
</svg>
