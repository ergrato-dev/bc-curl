  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">La CI del toolkit</text>
  <rect x="30" y="70" width="120" height="56" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="90" y="104" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">git push</text>
  <path d="M156 98 L200 98" stroke="#f0883e" stroke-width="2.2" fill="none" marker-end="url(#f-na)"/>
