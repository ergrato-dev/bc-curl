  <text x="357" y="273" text-anchor="middle" fill="#f0f6fc" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">curl --version …</text>
  <rect x="236" y="292" width="242" height="32" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <text x="357" y="313" text-anchor="middle" fill="#f0f6fc" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">shellcheck -S warning</text>
  <rect x="236" y="332" width="242" height="32" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <text x="357" y="353" text-anchor="middle" fill="#f0f6fc" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">bats tests/</text>
  <rect x="512" y="112" width="270" height="266" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="647" y="138" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">ubuntu:24.04</text>
  <text x="647" y="158" text-anchor="middle" fill="#8b949e" font-size="12">curl 8.5 · bats 1.10</text>
