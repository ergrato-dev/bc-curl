  <rect x="526" y="252" width="242" height="32" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <text x="647" y="273" text-anchor="middle" fill="#f0f6fc" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">curl --version …</text>
  <rect x="526" y="292" width="242" height="32" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <text x="647" y="313" text-anchor="middle" fill="#f0f6fc" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">shellcheck -S warning</text>
  <rect x="526" y="332" width="242" height="32" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <text x="647" y="353" text-anchor="middle" fill="#f0f6fc" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">bats tests/</text>
  <path d="M500 392 L500 426" stroke="#3fb950" stroke-width="2.2" fill="none" marker-end="url(#f-ve)"/>
  <rect x="300" y="430" width="400" height="40" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="455" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">✓ o ✗ en el commit</text>
</svg>
