  <text x="673" y="90" text-anchor="middle" fill="#e3b341" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">permissions: contents: read</text>
  <rect x="222" y="112" width="270" height="266" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="357" y="138" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">ubuntu:22.04</text>
  <text x="357" y="158" text-anchor="middle" fill="#8b949e" font-size="12">curl 7.81 · bats 1.2.1</text>
