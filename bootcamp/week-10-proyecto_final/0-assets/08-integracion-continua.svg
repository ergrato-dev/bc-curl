<svg viewBox="0 0 820 480" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Un push dispara el workflow. GitHub arranca un runner ubuntu-24.04 y, dentro, dos contenedores en paralelo: ubuntu:22.04 con curl 7.81 y bats 1.2.1, y ubuntu:24.04 con curl 8.5 y bats 1.10. En cada uno: checkout fijado por SHA, apt-get install de curl, jq, shellcheck y bats, shellcheck -S warning y bats tests/. El token del workflow solo tiene contents: read. El resultado vuelve al commit como una marca verde o roja</title>
  <rect width="820" height="480" fill="#0d1117"/>
