<svg viewBox="0 0 820 420" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Línea de tiempo de curl --retry 3 contra un servidor que responde 503: cuatro intentos separados por esperas de 1, 2 y 4 segundos, siete en total; debajo, lo que queda en cada destino tras los cuatro intentos: stdout con los cuatro cuerpos concatenados, el archivo de -D con los cuatro bloques de headers y el archivo de -o con solo el cuerpo del último intento</title>
  <rect width="820" height="420" fill="#0d1117"/>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">curl --retry 3 contra un 503</text>
  <path d="M60 140 L780 140" stroke="#30363d" stroke-width="2" fill="none"/>
  <path d="M60 134 L60 146" stroke="#30363d" stroke-width="1" fill="none"/>
  <text x="60" y="165" text-anchor="middle" fill="#8b949e" font-size="12">0 s</text>
  <path d="M160 134 L160 146" stroke="#30363d" stroke-width="1" fill="none"/>
  <text x="160" y="165" text-anchor="middle" fill="#8b949e" font-size="12">1 s</text>
  <path d="M260 134 L260 146" stroke="#30363d" stroke-width="1" fill="none"/>
  <text x="260" y="165" text-anchor="middle" fill="#8b949e" font-size="12">2 s</text>
  <path d="M360 134 L360 146" stroke="#30363d" stroke-width="1" fill="none"/>
  <text x="360" y="165" text-anchor="middle" fill="#8b949e" font-size="12">3 s</text>
  <path d="M460 134 L460 146" stroke="#30363d" stroke-width="1" fill="none"/>
  <text x="460" y="165" text-anchor="middle" fill="#8b949e" font-size="12">4 s</text>
  <path d="M560 134 L560 146" stroke="#30363d" stroke-width="1" fill="none"/>
  <text x="560" y="165" text-anchor="middle" fill="#8b949e" font-size="12">5 s</text>
  <path d="M660 134 L660 146" stroke="#30363d" stroke-width="1" fill="none"/>
  <text x="660" y="165" text-anchor="middle" fill="#8b949e" font-size="12">6 s</text>
  <path d="M760 134 L760 146" stroke="#30363d" stroke-width="1" fill="none"/>
  <text x="760" y="165" text-anchor="middle" fill="#8b949e" font-size="12">7 s</text>
  <rect x="26" y="80" width="68" height="36" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="60" y="103" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">503 #1</text>
  <rect x="126" y="80" width="68" height="36" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="160" y="103" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">503 #2</text>
  <rect x="326" y="80" width="68" height="36" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="360" y="103" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">503 #3</text>
  <rect x="726" y="80" width="68" height="36" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="760" y="103" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">503 #4</text>
  <path d="M94 98 L124 98" stroke="#e3b341" stroke-width="1.5" fill="none" marker-end="url(#f)" stroke-dasharray="4 3"/>
  <text x="110.0" y="72" text-anchor="middle" fill="#e3b341" font-size="13">espera 1 s</text>
  <path d="M194 98 L324 98" stroke="#e3b341" stroke-width="1.5" fill="none" marker-end="url(#f)" stroke-dasharray="4 3"/>
  <text x="260.0" y="72" text-anchor="middle" fill="#e3b341" font-size="13">espera 2 s</text>
  <path d="M394 98 L724 98" stroke="#e3b341" stroke-width="1.5" fill="none" marker-end="url(#f)" stroke-dasharray="4 3"/>
  <text x="560.0" y="72" text-anchor="middle" fill="#e3b341" font-size="13">espera 4 s</text>
  <text x="410" y="198" text-anchor="middle" fill="#8b949e" font-size="13">el -w se escribe una sola vez, al final, con los datos del último intento</text>
  <rect x="40" y="220" width="235" height="150" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="157" y="250" text-anchor="middle" fill="#f85149" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stdout</text>
  <text x="157" y="284" text-anchor="middle" fill="#f0f6fc" font-size="14">cuerpo 1 cuerpo 2</text>
  <text x="157" y="310" text-anchor="middle" fill="#f0f6fc" font-size="14">cuerpo 3 cuerpo 4</text>
  <text x="157" y="336" text-anchor="middle" fill="#f0f6fc" font-size="14">pegados: no se pueden borrar</text>
  <rect x="295" y="220" width="235" height="150" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="412" y="250" text-anchor="middle" fill="#e3b341" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-D cab.txt</text>
  <text x="412" y="284" text-anchor="middle" fill="#f0f6fc" font-size="14">4 bloques HTTP/</text>
  <text x="412" y="310" text-anchor="middle" fill="#f0f6fc" font-size="14">uno por intento</text>
  <text x="412" y="336" text-anchor="middle" fill="#f0f6fc" font-size="14">lee el último</text>
  <rect x="550" y="220" width="235" height="150" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="667" y="250" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-o cuerpo.json</text>
  <text x="667" y="284" text-anchor="middle" fill="#f0f6fc" font-size="14">solo el cuerpo 4</text>
  <text x="667" y="310" text-anchor="middle" fill="#f0f6fc" font-size="14">curl trunca antes</text>
  <text x="667" y="336" text-anchor="middle" fill="#f0f6fc" font-size="14">de cada reintento</text>
  <text x="410" y="400" text-anchor="middle" fill="#8b949e" font-size="13">sin --fail, tras el último 503 curl sale con 0</text>
</svg>
