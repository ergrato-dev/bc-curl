<svg viewBox="0 0 820 440" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Diagrama de un bucle de backoff: una petición que recibe 429; si la respuesta trae Retry-After, se espera lo que dice, salvo que sea demasiado y entonces se sale con 75; si no lo trae, la espera se dobla en cada intento, con un tope y un poco de azar; luego se reintenta. A la derecha, tres clientes que reintentan a la vez sin azar y vuelven a chocar, frente a tres con azar que se reparten en el tiempo</title>
  <rect width="820" height="440" fill="#0d1117"/>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Backoff ante un 429</text>
  <rect x="40" y="62" width="200" height="44" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="bold">petición: 429</text>
  <path d="M140 106 L140 128" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#f)"/>
  <rect x="40" y="130" width="200" height="44" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="140" y="158" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="bold">¿trae Retry-After?</text>
  <path d="M140 174 L90 206" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
  <path d="M140 174 L320 206" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
  <text x="100" y="194" text-anchor="end" fill="#3fb950" font-size="13" font-weight="bold">sí</text>
  <text x="250" y="190" fill="#f85149" font-size="13" font-weight="bold">no</text>
  <rect x="20" y="208" width="160" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="100" y="236" text-anchor="middle" fill="#f0f6fc" font-size="14">esperar lo que</text>
  <text x="100" y="258" text-anchor="middle" fill="#f0f6fc" font-size="14">dice la API</text>
  <rect x="200" y="208" width="250" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="325" y="236" text-anchor="middle" fill="#f0f6fc" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">min(tope, 2^n) segundos</text>
  <text x="325" y="258" text-anchor="middle" fill="#f0f6fc" font-size="13">+ azar en milisegundos</text>
  <path d="M100 278 L100 300" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
  <rect x="20" y="302" width="160" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="100" y="324" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">¿demasiado?</text>
  <text x="100" y="342" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">sí: salir con 75</text>
  <path d="M325 278 L325 370" stroke="#8b949e" stroke-width="1.5" fill="none"/>
  <path d="M180 330 L240 370" stroke="#8b949e" stroke-width="1.5" fill="none"/>
  <rect x="200" y="372" width="250" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="325" y="399" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="bold">reintentar (n + 1)</text>
  <path d="M490 60 L490 420" stroke="#30363d" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
  <text x="655" y="90" text-anchor="middle" fill="#f85149" font-size="15" font-weight="bold">sin azar</text>
  <path d="M530 112 L780 112" stroke="#30363d" stroke-width="1" fill="none"/>
  <rect x="540" y="104" width="18" height="16" rx="8" fill="#f85149" stroke="#f85149" stroke-width="1"/>
  <rect x="595" y="104" width="18" height="16" rx="8" fill="#f85149" stroke="#f85149" stroke-width="1"/>
  <rect x="705" y="104" width="18" height="16" rx="8" fill="#f85149" stroke="#f85149" stroke-width="1"/>
  <path d="M530 134 L780 134" stroke="#30363d" stroke-width="1" fill="none"/>
  <rect x="540" y="126" width="18" height="16" rx="8" fill="#f85149" stroke="#f85149" stroke-width="1"/>
  <rect x="595" y="126" width="18" height="16" rx="8" fill="#f85149" stroke="#f85149" stroke-width="1"/>
  <rect x="705" y="126" width="18" height="16" rx="8" fill="#f85149" stroke="#f85149" stroke-width="1"/>
  <path d="M530 156 L780 156" stroke="#30363d" stroke-width="1" fill="none"/>
  <rect x="540" y="148" width="18" height="16" rx="8" fill="#f85149" stroke="#f85149" stroke-width="1"/>
  <rect x="595" y="148" width="18" height="16" rx="8" fill="#f85149" stroke="#f85149" stroke-width="1"/>
  <rect x="705" y="148" width="18" height="16" rx="8" fill="#f85149" stroke="#f85149" stroke-width="1"/>
  <text x="655" y="196" text-anchor="middle" fill="#8b949e" font-size="13">vuelven a la vez, tres veces</text>
  <text x="655" y="250" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="bold">con azar</text>
  <path d="M530 272 L780 272" stroke="#30363d" stroke-width="1" fill="none"/>
  <rect x="540" y="264" width="18" height="16" rx="8" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <rect x="611.5" y="264" width="18" height="16" rx="8" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <rect x="738.0" y="264" width="18" height="16" rx="8" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <path d="M530 294 L780 294" stroke="#30363d" stroke-width="1" fill="none"/>
  <rect x="540" y="286" width="18" height="16" rx="8" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <rect x="633.5" y="286" width="18" height="16" rx="8" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <rect x="716.0" y="286" width="18" height="16" rx="8" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <path d="M530 316 L780 316" stroke="#30363d" stroke-width="1" fill="none"/>
  <rect x="540" y="308" width="18" height="16" rx="8" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <rect x="600.5" y="308" width="18" height="16" rx="8" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <rect x="754.5" y="308" width="18" height="16" rx="8" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <text x="655" y="356" text-anchor="middle" fill="#8b949e" font-size="13">los reintentos se reparten</text>
</svg>
