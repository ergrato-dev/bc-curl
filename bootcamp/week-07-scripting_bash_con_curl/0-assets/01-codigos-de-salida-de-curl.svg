<svg viewBox="0 0 820 420" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Los códigos de salida de curl ordenados por la fase en la que falla la petición: uso y URL (1, 2, 3), DNS (6), conexión TCP (7, y 28 por timeout), TLS (35, 56, 60), HTTP (22 solo con --fail, 47 por redirects) y escritura local (23); debajo, una respuesta 500 sin --fail sale con 0</title>
  <rect width="820" height="420" fill="#0d1117"/>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Un código por fase</text>
  <rect x="20" y="80" width="118" height="170" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="79" y="108" text-anchor="middle" fill="#d2a8ff" font-size="15" font-weight="bold">Uso y URL</text>
  <text x="32" y="140" fill="#f0f6fc" font-size="13">1 protocolo</text>
  <text x="32" y="166" fill="#f0f6fc" font-size="13">2 opción</text>
  <text x="32" y="192" fill="#f0f6fc" font-size="13">3 URL mal</text>
  <path d="M138 165 L152 165" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#f)"/>
  <rect x="154" y="80" width="118" height="170" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="213" y="108" text-anchor="middle" fill="#e3b341" font-size="15" font-weight="bold">DNS</text>
  <text x="166" y="140" fill="#f0f6fc" font-size="13">6 no resuelve</text>
  <path d="M272 165 L286 165" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#f)"/>
  <rect x="288" y="80" width="118" height="170" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="347" y="108" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="bold">TCP</text>
  <text x="300" y="140" fill="#f0f6fc" font-size="13">7 rechazada</text>
  <text x="300" y="166" fill="#f0f6fc" font-size="13">28 timeout</text>
  <path d="M406 165 L420 165" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#f)"/>
  <rect x="422" y="80" width="118" height="170" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="481" y="108" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">TLS</text>
  <text x="434" y="140" fill="#f0f6fc" font-size="13">35 handshake</text>
  <text x="434" y="166" fill="#f0f6fc" font-size="13">56 recepción</text>
  <text x="434" y="192" fill="#f0f6fc" font-size="13">60 certificado</text>
  <path d="M540 165 L554 165" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#f)"/>
  <rect x="556" y="80" width="118" height="170" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="615" y="108" text-anchor="middle" fill="#f85149" font-size="15" font-weight="bold">HTTP</text>
  <text x="568" y="140" fill="#f0f6fc" font-size="13">22 con --fail</text>
  <text x="568" y="166" fill="#f0f6fc" font-size="13">47 redirects</text>
  <path d="M674 165 L688 165" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#f)"/>
  <rect x="690" y="80" width="118" height="170" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="749" y="108" text-anchor="middle" fill="#8b949e" font-size="15" font-weight="bold">Local</text>
  <text x="702" y="140" fill="#f0f6fc" font-size="13">23 escritura</text>
  <text x="410" y="280" text-anchor="middle" fill="#8b949e" font-size="13">la petición avanza de izquierda a derecha y se para en la fase que falla</text>
  <rect x="50" y="305" width="720" height="80" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="410" y="335" text-anchor="middle" fill="#f0f6fc" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GET /status/500  →  el servidor responde 500</text>
  <text x="410" y="365" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">curl sale con 0: la transferencia fue bien. Solo --fail lo convierte en 22</text>
</svg>
