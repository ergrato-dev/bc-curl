<svg viewBox="0 0 800 400" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Una respuesta HTTP: línea de estado y headers terminados en CR LF, una línea vacía y el cuerpo; -i manda todo junto a stdout, -D archivo separa los headers a un archivo, -I pide solo los headers con HEAD</title>
  <rect width="800" height="400" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Una respuesta, dos partes</text>
  <rect x="40" y="60" width="420" height="160" rx="6" fill="#161b22" stroke="#58a6ff"/>
  <g font-size="14" fill="#f0f6fc">
    <text x="56" y="88">HTTP/1.1 200 OK</text><text x="444" y="88" text-anchor="end" fill="#f85149">\r\n</text>
    <text x="56" y="112">Content-Type: application/json</text><text x="444" y="112" text-anchor="end" fill="#f85149">\r\n</text>
    <text x="56" y="136">Etag: abc123</text><text x="444" y="136" text-anchor="end" fill="#f85149">\r\n</text>
    <text x="56" y="160">Content-Length: 96</text><text x="444" y="160" text-anchor="end" fill="#f85149">\r\n</text>
    <text x="56" y="194" fill="#e3b341">\r\n — línea vacía: fin de los headers</text>
  </g>
  <rect x="40" y="232" width="420" height="60" rx="6" fill="#161b22" stroke="#3fb950"/>
  <text x="56" y="268" fill="#f0f6fc" font-size="14">{ "ETag": "abc123", ... }   ← el cuerpo</text>
  <g font-size="14">
    <text x="490" y="84" fill="#f0883e" font-weight="bold">-i</text>
    <text x="520" y="84" fill="#8b949e">headers + cuerpo, juntos a stdout</text>
    <text x="490" y="124" fill="#3fb950" font-weight="bold">-D h.txt</text>
    <text x="560" y="124" fill="#8b949e">headers al archivo,</text>
    <text x="560" y="144" fill="#8b949e">cuerpo a stdout</text>
    <text x="490" y="184" fill="#d2a8ff" font-weight="bold">-I</text>
    <text x="520" y="184" fill="#8b949e">pide HEAD: solo headers</text>
    <text x="490" y="232" fill="#f85149" font-weight="bold">\r</text>
    <text x="520" y="232" fill="#8b949e">"abc123\r" ≠ "abc123"</text>
    <text x="520" y="252" fill="#8b949e">tr -d '\r' antes de comparar</text>
  </g>
  <text x="40" y="330" fill="#f0f6fc" font-size="14" font-weight="bold">Con -L, un bloque de headers por respuesta:</text>
  <g font-size="14">
    <rect x="40" y="344" width="200" height="34" rx="4" fill="#161b22" stroke="#e3b341"/><text x="140" y="366" text-anchor="middle" fill="#e3b341">302 + Location</text>
    <rect x="260" y="344" width="200" height="34" rx="4" fill="#161b22" stroke="#e3b341"/><text x="360" y="366" text-anchor="middle" fill="#e3b341">302 + Location</text>
    <rect x="480" y="344" width="200" height="34" rx="4" fill="#161b22" stroke="#3fb950"/><text x="580" y="366" text-anchor="middle" fill="#3fb950">200 ← el que quieres</text>
  </g>
</svg>
