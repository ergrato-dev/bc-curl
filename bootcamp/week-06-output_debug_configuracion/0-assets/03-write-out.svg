<svg viewBox="0 0 800 380" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Cómo se construye la salida de --write-out: la plantilla viene del argumento, de @archivo o de @-; al terminar la transferencia curl sustituye cada variable por su valor y cada \n por un salto; %{stderr} y %{stdout} cambian de flujo a mitad de la línea</title>
  <rect width="800" height="380" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">--write-out — plantilla que se rellena al final</text>
  <g font-size="14">
    <rect x="40" y="70" width="190" height="40" rx="6" fill="#161b22" stroke="#30363d"/><text x="135" y="95" text-anchor="middle" fill="#f0f6fc">-w '...'</text>
    <rect x="40" y="120" width="190" height="40" rx="6" fill="#161b22" stroke="#30363d"/><text x="135" y="145" text-anchor="middle" fill="#f0f6fc">-w @formato.txt</text>
    <rect x="40" y="170" width="190" height="40" rx="6" fill="#161b22" stroke="#30363d"/><text x="135" y="195" text-anchor="middle" fill="#f0f6fc">-w @-  (stdin)</text>
  </g>
  <path d="M230 140 L280 140" stroke="#8b949e" stroke-width="2"/>
  <rect x="280" y="90" width="480" height="100" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="300" y="118" fill="#f0883e" font-size="14" font-weight="bold">plantilla</text>
  <text x="300" y="146" font-size="15" fill="#79c0ff">codigo=%{http_code} salida=%{exitcode}\n</text>
  <text x="300" y="174" font-size="15" fill="#d2a8ff">%{stderr}total=%{time_total}\n</text>
  <text x="400" y="222" text-anchor="middle" fill="#8b949e" font-size="13">al terminar la transferencia — también si falló</text>
  <path d="M520 196 L520 250" stroke="#8b949e" stroke-width="2"/>
  <rect x="280" y="256" width="230" height="70" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="296" y="282" fill="#58a6ff" font-size="14" font-weight="bold">stdout</text>
  <text x="296" y="308" fill="#f0f6fc" font-size="15">codigo=200 salida=0</text>
  <rect x="530" y="256" width="230" height="70" rx="8" fill="#161b22" stroke="#d2a8ff"/>
  <text x="546" y="282" fill="#d2a8ff" font-size="14" font-weight="bold">stderr</text>
  <text x="546" y="308" fill="#f0f6fc" font-size="15">total=0.000912</text>
  <g font-size="13" fill="#8b949e">
    <text x="40" y="250">variable que no existe:</text>
    <text x="40" y="270">aviso en stderr,</text>
    <text x="40" y="290">cadena vacía y salida 0</text>
    <text x="40" y="350">En @archivo, los saltos de línea reales se ignoran: escribe \n</text>
  </g>
</svg>
