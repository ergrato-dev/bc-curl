  <text x="605" y="90" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">curl -K lista.txt</text>
  <text x="438" y="128" text-anchor="start" fill="#8b949e" font-size="12">proceso 1</text>
