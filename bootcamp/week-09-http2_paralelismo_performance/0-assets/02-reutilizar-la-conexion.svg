  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Un curl por petición frente a un curl para todas</text>
  <rect x="30" y="64" width="370" height="250" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="215" y="90" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">for ...; do curl URL; done</text>
