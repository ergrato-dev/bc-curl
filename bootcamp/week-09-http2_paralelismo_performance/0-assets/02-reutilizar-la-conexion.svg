  <text x="675.0" y="127.5" text-anchor="middle" fill="#3fb950" font-size="11.5">GET 1</text>
  <rect x="640" y="156" width="70" height="26" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="675.0" y="173.5" text-anchor="middle" fill="#3fb950" font-size="11.5">GET 2</text>
  <text x="720" y="174" text-anchor="start" fill="#3fb950" font-size="12">reusa</text>
  <rect x="640" y="202" width="70" height="26" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="675.0" y="219.5" text-anchor="middle" fill="#3fb950" font-size="11.5">GET 3</text>
