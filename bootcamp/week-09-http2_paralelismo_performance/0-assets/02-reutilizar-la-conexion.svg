  <text x="720" y="266" text-anchor="start" fill="#3fb950" font-size="12">reusa</text>
  <text x="605" y="300" text-anchor="middle" fill="#f0f6fc" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">num_connects: 1 0 0 0</text>
  <text x="215" y="300" text-anchor="middle" fill="#f0f6fc" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">num_connects: 1 1 1 1</text>
  <rect x="30" y="340" width="760" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="42" y="362" text-anchor="start" fill="#f0f6fc" font-size="12.5">En la línea:   curl -o a -o b URL_A URL_B        (un -o por URL, en orden)</text>
  <text x="42" y="381" text-anchor="start" fill="#f0f6fc" font-size="12.5">Con --next:    curl URL_A --next -X POST -d ... URL_B   (7.36.0+)</text>
  <text x="42" y="400" text-anchor="start" fill="#f0f6fc" font-size="12.5">En --config:   url = "..."  /  output = "/dev/null"   (escala, y fuera de ps)</text>
  <text x="42" y="419" text-anchor="start" fill="#f0f6fc" font-size="12.5"></text>
  <text x="42" y="438" text-anchor="start" fill="#f0f6fc" font-size="12.5">--no-keepalive NO cierra la conexión HTTP: apaga las sondas de TCP.</text>
  <text x="42" y="457" text-anchor="start" fill="#f0f6fc" font-size="12.5">Para forzar una conexión nueva:  -H "Connection: close"</text>
</svg>
