<svg viewBox="0 0 820 520" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Un bucle bash que lanza un curl por petición: cada proceso abre su conexión con DNS, TCP y TLS, pide, y muere con ella. Un solo curl con varias URLs: abre una conexión y la reutiliza. Al pie, las tres formas de dar varias URLs a un mismo curl: en la línea, con --next y en un --config</title>
