  <text x="42" y="432" text-anchor="start" fill="#f0f6fc" font-size="12.5">exec 9&gt;&gt;SESION.lock ; flock -w 30 9        (el kernel lo suelta si el proceso muere)</text>
  <text x="42" y="451" text-anchor="start" fill="#f0f6fc" font-size="12.5">con el cerrojo: si el token ya no es VISTO y no ha caducado → otro renovó → exec 9&gt;&amp;-</text>
  <text x="42" y="470" text-anchor="start" fill="#f0f6fc" font-size="12.5">El mv atómico evita leer un JSON a medias; no evita que ocho decidan renovar a la vez.</text>
  <text x="42" y="489" text-anchor="start" fill="#f0f6fc" font-size="12.5">El .lock no se borra: borrarlo abre otra carrera.</text>
