<svg viewBox="0 0 820 540" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Ocho procesos encuentran a la vez la sesión caducada. Sin cerrojo, los ocho piden un token nuevo al servidor y escriben la sesión uno encima de otro; con un refresh token que rota, el segundo y siguientes reciben invalid_grant. Con flock, el primero renueva mientras los demás esperan; al entrar, cada uno relee la sesión, ve que el token ya cambió y no ha caducado, y la usa sin renovar</title>
