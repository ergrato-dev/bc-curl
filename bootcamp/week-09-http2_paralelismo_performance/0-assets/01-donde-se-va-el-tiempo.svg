<svg viewBox="0 0 820 470" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Línea de tiempo de una petición HTTPS nueva: DNS, conexión TCP, handshake TLS, espera del servidor y transferencia, con la variable de --write-out que marca el final de cada fase. Debajo, la misma petición sobre una conexión reutilizada: solo quedan servidor y transferencia, y num_connects vale 0</title>
  <rect width="820" height="470" fill="#0d1117"/>
  <defs><marker id="f-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0d1117"/></marker><marker id="f-sf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#161b22"/></marker><marker id="f-bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#30363d"/></marker><marker id="f-tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0f6fc"/></marker><marker id="f-t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="f-na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="f-az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="f-az2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker><marker id="f-ve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="f-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="f-ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="f-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d2a8ff"/></marker></defs>
  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Dónde se va el tiempo de una petición</text>
  <text x="40" y="78" text-anchor="start" fill="#f0f6fc" font-size="14" font-weight="bold">Conexión nueva   (num_connects = 1)</text>
  <rect x="40" y="92" width="70" height="26" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.6"/>
  <text x="75.0" y="109.5" text-anchor="middle" fill="#d2a8ff" font-size="11.5">DNS</text>
  <rect x="110" y="92" width="110" height="26" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="165.0" y="109.5" text-anchor="middle" fill="#58a6ff" font-size="11.5">TCP</text>
  <rect x="220" y="92" width="220" height="26" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.6"/>
  <text x="330.0" y="109.5" text-anchor="middle" fill="#f0883e" font-size="11.5">TLS</text>
  <rect x="440" y="92" width="150" height="26" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="515.0" y="109.5" text-anchor="middle" fill="#3fb950" font-size="11.5">servidor</text>
  <rect x="590" y="92" width="110" height="26" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
  <text x="645.0" y="109.5" text-anchor="middle" fill="#e3b341" font-size="11.5">transfer.</text>
  <path d="M110 120 L110 140" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#f-t2)"/>
  <text x="114" y="152" text-anchor="start" fill="#d2a8ff" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">%{time_namelookup}</text>
  <path d="M220 120 L220 160" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#f-t2)"/>
  <text x="216" y="172" text-anchor="end" fill="#58a6ff" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">%{time_connect}</text>
  <path d="M440 120 L440 180" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#f-t2)"/>
  <text x="436" y="192" text-anchor="end" fill="#f0883e" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">%{time_appconnect}</text>
  <path d="M590 120 L590 200" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#f-t2)"/>
  <text x="586" y="212" text-anchor="end" fill="#3fb950" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">%{time_starttransfer}</text>
  <path d="M700 120 L700 220" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#f-t2)"/>
  <text x="696" y="232" text-anchor="end" fill="#e3b341" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">%{time_total}</text>
  <text x="40" y="270" text-anchor="start" fill="#f0f6fc" font-size="14" font-weight="bold">Conexión reutilizada   (num_connects = 0)</text>
  <rect x="40" y="284" width="150" height="26" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="115.0" y="301.5" text-anchor="middle" fill="#3fb950" font-size="11.5">servidor</text>
  <rect x="190" y="284" width="110" height="26" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
  <text x="245.0" y="301.5" text-anchor="middle" fill="#e3b341" font-size="11.5">transfer.</text>
  <text x="320" y="302" text-anchor="start" fill="#8b949e" font-size="12.5">DNS, TCP y TLS desaparecen</text>
  <rect x="40" y="340" width="740" height="71" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="52" y="362" text-anchor="start" fill="#f0f6fc" font-size="12.5">Las time_* son instantes acumulados: cada fase es la resta de dos.</text>
  <text x="52" y="381" text-anchor="start" fill="#f0f6fc" font-size="12.5">Con 90 ms de RTT, una conexión nueva cuesta 3-5 viajes; una reutilizada, 1.</text>
  <text x="52" y="400" text-anchor="start" fill="#f0f6fc" font-size="12.5">En una API manda la latencia (viajes), no el ancho de banda (bytes).</text>
</svg>
