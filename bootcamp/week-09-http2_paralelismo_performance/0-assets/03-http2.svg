<svg viewBox="0 0 820 520" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>HTTP/1.1 frente a HTTP/2: tres peticiones en HTTP/1.1 necesitan tres conexiones o esperar en fila; en HTTP/2 viajan como streams 1, 3 y 5 intercalados en una sola conexión. Debajo, la negociación: ALPN dentro del handshake TLS ofrece h2 y http/1.1 y el servidor elige h2; sin TLS, h2c necesita Upgrade o prior knowledge</title>
