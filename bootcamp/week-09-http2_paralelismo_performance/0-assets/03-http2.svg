  <text x="605" y="220" text-anchor="middle" fill="#8b949e" font-size="12">frames HEADERS y DATA intercalados</text>
  <text x="605" y="242" text-anchor="middle" fill="#8b949e" font-size="12">cabeceras en minúscula, comprimidas (HPACK)</text>
  <text x="605" y="264" text-anchor="middle" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">MAX_CONCURRENT_STREAMS == 250</text>
  <rect x="30" y="312" width="760" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="42" y="334" text-anchor="start" fill="#f0f6fc" font-size="12.5">https://   ALPN dentro del handshake TLS: ofrece h2, http/1.1 → el servidor elige h2</text>
  <text x="42" y="353" text-anchor="start" fill="#f0f6fc" font-size="12.5">           por defecto desde curl 7.62.0, sin flags ni viajes extra</text>
  <text x="42" y="372" text-anchor="start" fill="#f0f6fc" font-size="12.5">http://    --http2: HTTP/1.1 con "Upgrade: h2c" → el laboratorio responde en 1.1</text>
  <text x="42" y="391" text-anchor="start" fill="#f0f6fc" font-size="12.5">           --http2-prior-knowledge (7.49.0): HTTP/2 directo → exit 52 si no lo sabe</text>
  <text x="42" y="410" text-anchor="start" fill="#f0f6fc" font-size="12.5">Para saber cuál se usó:  -w "%{http_version}"  →  1.1 | 2 | 3</text>
