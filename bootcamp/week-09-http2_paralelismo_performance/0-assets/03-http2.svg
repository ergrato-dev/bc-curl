  <text x="605" y="88" text-anchor="middle" fill="#3fb950" font-size="13.5" font-weight="bold">HTTP/2: streams en una conexión</text>
  <text x="438" y="126" text-anchor="start" fill="#8b949e" font-size="12">conexión 1</text>
