<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, Helvetica, sans-serif">
  <title>Línea de tiempo de una petición: DNS, TCP, TLS, espera del primer byte y transferencia; qué tramo cubre --connect-timeout, cuál --max-time y cuál --speed-limit, con el mensaje del código 28 de cada uno</title>
  <rect width="800" height="380" fill="#0d1117"/>
  <text x="400" y="32" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Timeouts — qué tramo vigila cada flag</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40" y="70" width="80" height="40" fill="#79c0ff" opacity="0.85"/><text x="80" y="95" fill="#0d1117" font-weight="bold">DNS</text>
    <rect x="120" y="70" width="90" height="40" fill="#79c0ff" opacity="0.7"/><text x="165" y="95" fill="#0d1117" font-weight="bold">TCP</text>
    <rect x="210" y="70" width="110" height="40" fill="#79c0ff" opacity="0.55"/><text x="265" y="95" fill="#0d1117" font-weight="bold">TLS</text>
    <rect x="320" y="70" width="230" height="40" fill="#e3b341" opacity="0.6"/><text x="435" y="95" fill="#0d1117" font-weight="bold">espera del primer byte</text>
    <rect x="550" y="70" width="210" height="40" fill="#3fb950" opacity="0.6"/><text x="655" y="95" fill="#0d1117" font-weight="bold">transferencia</text>
  </g>
  <g font-family="'Courier New', monospace" font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="120" y="126">time_namelookup</text>
    <text x="210" y="140">time_connect</text>
    <text x="320" y="126">time_appconnect</text>
    <text x="550" y="140">time_starttransfer</text>
    <text x="760" y="126">time_total</text>
  </g>

  <line x1="40" y1="170" x2="320" y2="170" stroke="#79c0ff" stroke-width="3"/>
  <text x="40" y="162" fill="#79c0ff" font-size="13" font-weight="bold">--connect-timeout 5</text>
  <text x="340" y="174" fill="#8b949e" font-size="11">28: Connection timeout after N ms · por defecto 300 s</text>

  <line x1="40" y1="216" x2="760" y2="216" stroke="#f0883e" stroke-width="3"/>
  <text x="40" y="208" fill="#f0883e" font-size="13" font-weight="bold">--max-time 10</text>
  <text x="40" y="236" fill="#8b949e" font-size="11">28: Operation timed out after N milliseconds with M bytes received · por defecto, sin límite</text>

  <line x1="550" y1="276" x2="760" y2="276" stroke="#3fb950" stroke-width="3"/>
  <text x="550" y="268" fill="#3fb950" font-size="13" font-weight="bold">--speed-limit / --speed-time</text>
  <text x="550" y="296" fill="#8b949e" font-size="11">transferencia atascada (Semana 04)</text>

  <rect x="40" y="318" width="720" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="345" text-anchor="middle" fill="#f0f6fc" font-size="12">Con --retry, cada intento tiene su propio --max-time: el total es intentos × max-time + esperas</text>
</svg>
