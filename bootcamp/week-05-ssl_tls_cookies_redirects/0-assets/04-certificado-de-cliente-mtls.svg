<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, Helvetica, sans-serif">
  <title>Handshake mTLS: el servidor pide certificado, curl presenta --cert y firma con --key; abajo los tres fallos con sus códigos 56 y 58</title>
  <rect width="800" height="420" fill="#0d1117"/>
  <text x="400" y="32" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">mTLS — el cliente también demuestra quién es</text>

  <rect x="20" y="60" width="180" height="200" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="110" y="86" text-anchor="middle" fill="#79c0ff" font-size="15" font-weight="bold">curl</text>
  <text x="110" y="120" text-anchor="middle" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="12">--cert cliente.crt</text>
  <text x="110" y="138" text-anchor="middle" fill="#8b949e" font-size="11">viaja · no es secreto</text>
  <text x="110" y="176" text-anchor="middle" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="12">--key cliente.key</text>
  <text x="110" y="194" text-anchor="middle" fill="#e3b341" font-size="11">no viaja · permisos 600</text>
  <rect x="600" y="60" width="180" height="200" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="690" y="86" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="bold">servidor</text>

  <g font-size="12">
    <line x1="600" y1="110" x2="200" y2="110" stroke="#f0883e" stroke-width="1.5"/>
    <text x="400" y="104" text-anchor="middle" fill="#f0f6fc">su certificado + Certificate Request</text>
    <line x1="200" y1="160" x2="600" y2="160" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="400" y="154" text-anchor="middle" fill="#f0f6fc">cliente.crt</text>
    <line x1="200" y1="210" x2="600" y2="210" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="400" y="204" text-anchor="middle" fill="#f0f6fc">firma con cliente.key: "el certificado es mío"</text>
    <text x="400" y="240" text-anchor="middle" fill="#3fb950">mTLS OK</text>
  </g>

  <g font-size="12">
    <rect x="20" y="286" width="246" height="116" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="36" y="310" fill="#f85149" font-weight="bold">sin --cert</text>
    <text x="36" y="334" fill="#f0f6fc">el servidor corta</text>
    <text x="36" y="354" fill="#8b949e" font-size="11">alert certificate required</text>
    <text x="36" y="386" fill="#f85149" font-size="18" font-weight="bold">56</text>
    <rect x="277" y="286" width="246" height="116" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="293" y="310" fill="#f85149" font-weight="bold">sin --key, o de otro par</text>
    <text x="293" y="334" fill="#f0f6fc">curl no llega a conectar</text>
    <text x="293" y="354" fill="#8b949e" font-size="11">unable to set private key file</text>
    <text x="293" y="386" fill="#f85149" font-size="18" font-weight="bold">58</text>
    <rect x="534" y="286" width="246" height="116" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="550" y="310" fill="#e3b341" font-weight="bold">clave cifrada sin frase</text>
    <text x="550" y="334" fill="#f0f6fc">Enter PEM pass phrase:</text>
    <text x="550" y="354" fill="#8b949e" font-size="11">frase en --config, nunca --pass</text>
    <text x="550" y="386" fill="#e3b341" font-size="18" font-weight="bold">58</text>
  </g>
</svg>
