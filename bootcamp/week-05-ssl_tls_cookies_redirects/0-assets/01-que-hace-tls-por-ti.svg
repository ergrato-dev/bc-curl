<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, Helvetica, sans-serif">
  <title>Handshake TLS visto desde curl: ofrecer versiones, recibir el certificado, comprobar cadena, nombre y fechas, y solo entonces enviar la petición; los códigos 35 y 60 en el punto donde falla cada fase</title>
  <rect width="800" height="420" fill="#0d1117"/>
  <text x="400" y="32" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Qué hace TLS por ti</text>
  <text x="400" y="52" text-anchor="middle" fill="#8b949e" font-size="12">antes del primer byte de tu petición</text>

  <rect x="20" y="76" width="200" height="300" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="120" y="102" text-anchor="middle" fill="#79c0ff" font-size="15" font-weight="bold">curl</text>
  <rect x="580" y="76" width="200" height="300" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="680" y="102" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="bold">servidor</text>

  <g font-size="12">
    <line x1="220" y1="130" x2="580" y2="130" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="400" y="124" text-anchor="middle" fill="#f0f6fc">Client hello · ALPN: h2, http/1.1 · SNI: localhost</text>
    <line x1="580" y1="170" x2="220" y2="170" stroke="#f0883e" stroke-width="1.5"/>
    <text x="400" y="164" text-anchor="middle" fill="#f0f6fc">Server hello · certificado + intermedia</text>
    <text x="400" y="190" text-anchor="middle" fill="#f85149" font-size="11">si falla aquí (versión, SNI desconocido): 35</text>
  </g>

  <rect x="240" y="210" width="320" height="104" rx="6" fill="#0d1117" stroke="#e3b341" stroke-width="1.2"/>
  <text x="400" y="230" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">curl comprueba</text>
  <g font-size="12" fill="#f0f6fc">
    <text x="260" y="252">1. cadena hasta una CA de confianza</text>
    <text x="260" y="272">2. el host en el subjectAltName</text>
    <text x="260" y="292">3. el reloj entre las dos fechas</text>
  </g>
  <text x="400" y="332" text-anchor="middle" fill="#f85149" font-size="11">si falla cualquiera: 60</text>

  <line x1="220" y1="356" x2="580" y2="356" stroke="#3fb950" stroke-width="2"/>
  <text x="400" y="350" text-anchor="middle" fill="#3fb950" font-size="12">GET /get · cifrado, íntegro y con quien dice ser</text>

  <text x="400" y="404" text-anchor="middle" fill="#8b949e" font-size="11">-k apaga el recuadro amarillo: el cifrado sigue, la autenticidad desaparece</text>
</svg>
