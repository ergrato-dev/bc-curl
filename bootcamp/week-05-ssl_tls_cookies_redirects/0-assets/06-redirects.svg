<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, Helvetica, sans-serif">
  <title>Qué hace curl -L con el método según el código, qué credenciales viajan al cambiar de host y los límites --max-redirs y --proto-redir</title>
  <rect width="800" height="420" fill="#0d1117"/>
  <text x="400" y="32" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Redirects — lo que cambia en el salto</text>

  <rect x="20" y="56" width="370" height="200" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="40" y="80" fill="#79c0ff" font-size="14" font-weight="bold">POST con -d, y -L</text>
  <g font-size="12">
    <text x="40" y="110" fill="#f0f6fc" font-family="'Courier New', monospace">301 · 302 · 303</text>
    <text x="200" y="110" fill="#f85149">GET, sin cuerpo</text>
    <text x="40" y="140" fill="#f0f6fc" font-family="'Courier New', monospace">307 · 308</text>
    <text x="200" y="140" fill="#3fb950">POST, mismo cuerpo</text>
    <text x="40" y="176" fill="#f0f6fc" font-family="'Courier New', monospace">-X POST -L</text>
    <text x="200" y="176" fill="#e3b341">POST siempre, aunque</text>
    <text x="200" y="192" fill="#e3b341">el 303 pida GET</text>
    <text x="40" y="232" fill="#8b949e" font-size="11">--post301/302/303 mantienen el POST a propósito</text>
  </g>

  <rect x="410" y="56" width="370" height="200" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="430" y="80" fill="#f0883e" font-size="14" font-weight="bold">Salto a OTRO host</text>
  <g font-size="12">
    <text x="430" y="110" fill="#f0f6fc">-u usuario:pw</text>
    <text x="620" y="110" fill="#3fb950">se quita</text>
    <text x="430" y="140" fill="#f0f6fc">-H 'Authorization: ...'</text>
    <text x="620" y="140" fill="#3fb950">se quita</text>
    <text x="430" y="170" fill="#f0f6fc">-H 'X-API-Key: ...'</text>
    <text x="620" y="170" fill="#f85149">VIAJA entero</text>
    <text x="430" y="200" fill="#f0f6fc">--location-trusted</text>
    <text x="620" y="200" fill="#f85149">viaja todo</text>
    <text x="430" y="232" fill="#8b949e" font-size="11">curl no sabe que un header propio es secreto</text>
  </g>

  <g font-size="12">
    <rect x="20" y="276" width="370" height="124" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="40" y="300" fill="#e3b341" font-weight="bold">--max-redirs 5</text>
    <text x="40" y="324" fill="#f0f6fc">por defecto, 50 saltos</text>
    <text x="40" y="346" fill="#8b949e" font-size="11">un bucle cuesta 50 peticiones antes de fallar</text>
    <text x="40" y="380" fill="#e3b341" font-size="18" font-weight="bold">47</text>
    <rect x="410" y="276" width="370" height="124" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="430" y="300" fill="#d2a8ff" font-weight="bold">--proto-redir '=https'</text>
    <text x="430" y="324" fill="#f0f6fc">https → http bloqueado</text>
    <text x="430" y="346" fill="#8b949e" font-size="11">comillas en zsh: =https se expande</text>
    <text x="430" y="380" fill="#d2a8ff" font-size="18" font-weight="bold">1</text>
  </g>
</svg>
