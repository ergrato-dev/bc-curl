<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, Helvetica, sans-serif">
  <title>El mismo archivo de 30000 bytes subido en crudo, en multipart y en JSON con base64, con los bytes enviados y el coste en memoria de cada forma</title>
  <rect width="800" height="400" fill="#0d1117"/>

  <text x="400" y="32" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Elegir cómo subir — el mismo archivo, tres formas</text>
  <text x="400" y="52" text-anchor="middle" fill="#8b949e" font-size="12">foto.bin, 30.000 bytes · medido con %{size_upload}</text>

  <!-- Barras: escala 30000 bytes = 450 px -->
  <text x="20" y="104" fill="#f0883e" font-size="14" font-weight="bold">Crudo</text>
  <text x="20" y="122" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">-T foto.bin</text>
  <rect x="170" y="88" width="450" height="34" rx="4" fill="#f0883e" opacity="0.85"/>
  <text x="632" y="111" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="13">30.000</text>

  <text x="20" y="174" fill="#79c0ff" font-size="14" font-weight="bold">Multipart</text>
  <text x="20" y="192" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">-F 'foto=@foto.bin'</text>
  <rect x="170" y="158" width="450" height="34" rx="4" fill="#79c0ff" opacity="0.85"/>
  <rect x="620" y="158" width="3" height="34" fill="#d2a8ff"/>
  <text x="632" y="181" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="13">30.200</text>

  <text x="20" y="244" fill="#d2a8ff" font-size="14" font-weight="bold">JSON + base64</text>
  <text x="20" y="262" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">--rawfile + @-</text>
  <rect x="170" y="228" width="450" height="34" rx="4" fill="#d2a8ff" opacity="0.85"/>
  <rect x="620" y="228" width="150" height="34" rx="4" fill="#f85149" opacity="0.7"/>
  <text x="695" y="250" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="bold">+33 %</text>
  <text x="632" y="282" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="13">40.046</text>

  <line x1="20" y1="300" x2="780" y2="300" stroke="#30363d" stroke-width="1"/>

  <g font-size="11">
    <text x="20" y="326" fill="#f0883e" font-weight="bold">Crudo</text>
    <text x="20" y="344" fill="#8b949e">streaming · un solo archivo</text>
    <text x="20" y="362" fill="#8b949e">S3, registries, WebDAV</text>

    <text x="280" y="326" fill="#79c0ff" font-weight="bold">Multipart</text>
    <text x="280" y="344" fill="#8b949e">streaming · metadatos y varios archivos</text>
    <text x="280" y="362" fill="#8b949e">"adjuntar archivo", formularios</text>

    <text x="560" y="326" fill="#d2a8ff" font-weight="bold">JSON + base64</text>
    <text x="560" y="344" fill="#f85149">archivo entero en memoria</text>
    <text x="560" y="362" fill="#8b949e">APIs que solo hablan JSON</text>
  </g>

  <text x="400" y="390" text-anchor="middle" fill="#8b949e" font-size="11">El formato lo elige el servidor. Tú eliges entre los que acepta.</text>
</svg>
