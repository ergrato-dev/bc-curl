<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Arial, Helvetica, sans-serif">
  <title>De donde sale el nombre del archivo con -o, -O y -OJ, y el 404 guardado como si fuera el archivo cuando falta --fail</title>
  <rect width="800" height="440" fill="#0d1117"/>

  <text x="400" y="32" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Descargar — quién pone el nombre</text>
  <text x="400" y="52" text-anchor="middle" fill="#8b949e" font-size="12">y qué queda en el disco cuando el servidor dice que no</text>

  <!-- Tres columnas -->
  <rect x="20" y="78" width="240" height="120" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="140" y="102" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="bold">-o datos.bin</text>
  <text x="140" y="124" text-anchor="middle" fill="#8b949e" font-size="11">el nombre lo eliges tú</text>
  <text x="140" y="160" text-anchor="middle" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="13">datos.bin</text>
  <text x="140" y="184" text-anchor="middle" fill="#3fb950" font-size="11">predecible siempre</text>

  <rect x="280" y="78" width="240" height="120" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="400" y="102" text-anchor="middle" fill="#e3b341" font-size="15" font-weight="bold">-O</text>
  <text x="400" y="124" text-anchor="middle" fill="#8b949e" font-size="11">último segmento de la URL</text>
  <text x="400" y="146" text-anchor="middle" fill="#8b949e" font-family="'Courier New', monospace" font-size="10">/range/30?formato=txt</text>
  <text x="400" y="166" text-anchor="middle" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="13">30?formato=txt</text>
  <text x="400" y="186" text-anchor="middle" fill="#e3b341" font-size="11">la query string entra en el nombre</text>

  <rect x="540" y="78" width="240" height="120" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="660" y="102" text-anchor="middle" fill="#79c0ff" font-size="15" font-weight="bold">-O -J</text>
  <text x="660" y="124" text-anchor="middle" fill="#8b949e" font-size="11">lo decide el servidor</text>
  <text x="660" y="146" text-anchor="middle" fill="#8b949e" font-family="'Courier New', monospace" font-size="9">Content-Disposition: filename=</text>
  <text x="660" y="166" text-anchor="middle" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="13">informe.txt</text>
  <text x="660" y="186" text-anchor="middle" fill="#79c0ff" font-size="11">%{filename_effective} lo dice</text>

  <line x1="20" y1="218" x2="780" y2="218" stroke="#30363d" stroke-width="1"/>

  <!-- El fallo -->
  <rect x="20" y="236" width="370" height="184" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="40" y="262" fill="#f85149" font-size="14" font-weight="bold">✗ Sin --fail</text>
  <text x="40" y="286" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">curl -s -o informe.pdf URL</text>
  <text x="40" y="306" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">← 404 Not Found</text>
  <text x="40" y="326" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">código de salida: 0</text>
  <rect x="40" y="342" width="330" height="30" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="55" y="362" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="11">informe.pdf = "404 page not found"</text>
  <text x="40" y="400" fill="#f0f6fc" font-size="11">El siguiente paso del script trabaja con basura</text>

  <rect x="410" y="236" width="370" height="184" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="430" y="262" fill="#3fb950" font-size="14" font-weight="bold">✓ Con --fail</text>
  <text x="430" y="286" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">curl -fsS -o informe.pdf URL</text>
  <text x="430" y="306" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">← 404 Not Found</text>
  <text x="430" y="326" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">código de salida: 22</text>
  <rect x="430" y="342" width="330" height="30" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="445" y="362" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="11">el cuerpo del error no se escribe</text>
  <text x="430" y="400" fill="#f0f6fc" font-size="11">--fail, no --fail-with-body: el error no va al archivo</text>
</svg>
