<svg viewBox="0 0 820 440" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Anatomía de una petición al endpoint de token: el --config con permisos 600 con la línea user y una línea data-urlencode por campo; el POST que curl construye con Authorization Basic y el cuerpo form-urlencoded; y las dos respuestas posibles, 200 con el token o 400/401 con error y error_description</title>
  <rect width="820" height="440" fill="#0d1117"/>
  <defs><marker id="f-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0d1117"/></marker><marker id="f-sf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#161b22"/></marker><marker id="f-bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#30363d"/></marker><marker id="f-tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0f6fc"/></marker><marker id="f-t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="f-na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="f-az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="f-az2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker><marker id="f-ve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="f-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="f-ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="f-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d2a8ff"/></marker></defs>
  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">El endpoint de token, por dentro</text>
  <rect x="24" y="70" width="250" height="190" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="40" y="96" text-anchor="start" fill="#f0883e" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">--config  (600)</text>
  <text x="40" y="126" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">user = "id:secreto"</text>
  <text x="40" y="145" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">data-urlencode =</text>
  <text x="40" y="164" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">  "grant_type=</text>
  <text x="40" y="183" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">   client_credentials"</text>
  <text x="40" y="202" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">data-urlencode =</text>
  <text x="40" y="221" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">  "scope=leer"</text>
  <text x="149" y="290" text-anchor="middle" fill="#8b949e" font-size="12">fuera de ps y del historial</text>
  <path d="M276 165 L300 165" stroke="#f0883e" stroke-width="2.2" fill="none" marker-end="url(#f-na)"/>
  <rect x="304" y="70" width="250" height="190" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="320" y="96" text-anchor="start" fill="#58a6ff" font-size="14" font-weight="bold">Lo que curl envía</text>
  <text x="320" y="126.0" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">POST /default/token</text>
  <text x="320" y="143.5" text-anchor="start" fill="#e3b341" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">Authorization: Basic</text>
  <text x="320" y="161.0" text-anchor="start" fill="#e3b341" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">  aWQ6c2VjcmV0bw==</text>
  <text x="320" y="178.5" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">Content-Type:</text>
  <text x="320" y="196.0" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">  x-www-form-urlencoded</text>
  <text x="320" y="213.5" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve"></text>
  <text x="320" y="231.0" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">grant_type=client_</text>
  <text x="320" y="248.5" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">  credentials&amp;scope=leer</text>
  <text x="429" y="290" text-anchor="middle" fill="#8b949e" font-size="12">base64 no es cifrado: la traza se tacha</text>
  <path d="M556 130 L582 110" stroke="#3fb950" stroke-width="2.2" fill="none" marker-end="url(#f-ve)"/>
  <path d="M556 200 L582 230" stroke="#f85149" stroke-width="2.2" fill="none" marker-end="url(#f-ro)"/>
  <rect x="586" y="70" width="214" height="120" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="94" text-anchor="start" fill="#3fb950" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">200</text>
  <text x="600" y="118" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">access_token</text>
  <text x="600" y="136" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">token_type: Bearer</text>
  <text x="600" y="154" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">expires_in: 3599</text>
  <text x="600" y="172" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">scope</text>
  <rect x="586" y="204" width="214" height="96" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="600" y="228" text-anchor="start" fill="#f85149" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">400 / 401</text>
  <text x="600" y="252" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">error</text>
  <text x="600" y="270" text-anchor="start" fill="#f0f6fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">error_description</text>
  <rect x="24" y="330" width="776" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="44" y="356" text-anchor="start" fill="#f0f6fc" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">error decide el código de salida del toolkit:</text>
  <text x="44" y="378" text-anchor="start" fill="#f85149" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">invalid_client, invalid_grant   →  77, la credencial no vale</text>
  <text x="44" y="400" text-anchor="start" fill="#e3b341" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">invalid_request                 →  1, la petición está mal hecha</text>
</svg>
