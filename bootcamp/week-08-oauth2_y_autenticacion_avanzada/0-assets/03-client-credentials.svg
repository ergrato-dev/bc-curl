<svg viewBox="0 0 820 500" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Secuencia de client credentials: el script envía un POST a /token con grant_type=client_credentials, el scope y su autenticación Basic; recibe access_token y expires_in sin refresh_token; lo guarda con su instante de caducidad y lo presenta como Bearer a la API; cuando caduca, pide otro con las mismas credenciales</title>
  <rect width="820" height="500" fill="#0d1117"/>
  <defs><marker id="f-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0d1117"/></marker><marker id="f-sf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#161b22"/></marker><marker id="f-bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#30363d"/></marker><marker id="f-tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0f6fc"/></marker><marker id="f-t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="f-na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="f-az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="f-az2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker><marker id="f-ve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="f-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="f-ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="f-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d2a8ff"/></marker></defs>
  <text x="410.0" y="34" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Client credentials</text>
  <rect x="45" y="60" width="190" height="52" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="140" y="83" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="bold">Script</text>
  <text x="140" y="102" text-anchor="middle" fill="#8b949e" font-size="12">api-toolkit, un cron</text>
  <path d="M140 112 L140 480" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="315" y="60" width="190" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="410" y="83" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">Servidor OAuth2</text>
  <text x="410" y="102" text-anchor="middle" fill="#8b949e" font-size="12">/token</text>
  <path d="M410 112 L410 480" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="585" y="60" width="190" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="680" y="83" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="bold">API</text>
  <text x="680" y="102" text-anchor="middle" fill="#8b949e" font-size="12">/userinfo</text>
  <path d="M680 112 L680 480" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M140 160 L406 160" stroke="#f0883e" stroke-width="2.2" fill="none" marker-end="url(#f-na)"/>
  <text x="275.0" y="152" text-anchor="middle" fill="#f0883e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">POST grant_type=client_credentials</text>
  <text x="275.0" y="177" text-anchor="middle" fill="#8b949e" font-size="11.5">scope=leer · Authorization: Basic</text>
  <path d="M410 220 L144 220" stroke="#58a6ff" stroke-width="2.2" fill="none" marker-end="url(#f-az)"/>
  <text x="275.0" y="212" text-anchor="middle" fill="#58a6ff" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">200 access_token, expires_in</text>
  <text x="275.0" y="237" text-anchor="middle" fill="#8b949e" font-size="11.5">sin refresh_token (RFC 6749, 4.4.3)</text>
  <rect x="30" y="252" width="230" height="52" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="42" y="274" text-anchor="start" fill="#f0f6fc" font-size="12.5">guarda expires_at =</text>
  <text x="42" y="293" text-anchor="start" fill="#f0f6fc" font-size="12.5">ahora + expires_in</text>
  <path d="M140 330 L676 330" stroke="#f0883e" stroke-width="2.2" fill="none" marker-end="url(#f-na)"/>
  <text x="410.0" y="322" text-anchor="middle" fill="#f0883e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">Authorization: Bearer &lt;TOKEN&gt;</text>
  <path d="M680 380 L144 380" stroke="#3fb950" stroke-width="2.2" fill="none" marker-end="url(#f-ve)"/>
  <text x="410.0" y="372" text-anchor="middle" fill="#3fb950" font-size="12">200 + datos</text>
  <rect x="30" y="410" width="760" height="52" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="42" y="432" text-anchor="start" fill="#f0f6fc" font-size="12.5">al caducar (o 30 s antes): otra vez el mismo POST, con las mismas credenciales.</text>
  <text x="42" y="451" text-anchor="start" fill="#f0f6fc" font-size="12.5">No hay persona a la que preguntar, y no hace falta refresh token.</text>
</svg>
