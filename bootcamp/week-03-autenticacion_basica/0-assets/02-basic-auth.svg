<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Arial, Helvetica, sans-serif">
  <title>Basic Auth: usuario y password unidos por dos puntos, codificados en base64, y la operacion inversa sin ninguna clave</title>
  <rect width="800" height="440" fill="#0d1117"/>

  <text x="400" y="32" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Basic Auth — codificar no es cifrar</text>
  <text x="400" y="52" text-anchor="middle" fill="#8b949e" font-size="12">base64 es reversible sin ninguna clave: lo que protege es TLS</text>

  <!-- Cadena de transformacion -->
  <rect x="20" y="82" width="230" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="135" y="106" text-anchor="middle" fill="#8b949e" font-size="10">usuario y password</text>
  <text x="135" y="126" text-anchor="middle" fill="#f0f6fc" font-family="'Courier New', monospace" font-size="13">user:password</text>

  <line x1="256" y1="110" x2="306" y2="110" stroke="#f0883e" stroke-width="2"/>
  <polygon points="306,110 298,106 298,114" fill="#f0883e"/>
  <text x="281" y="100" text-anchor="middle" fill="#f0883e" font-size="10">base64</text>

  <rect x="312" y="82" width="270" height="56" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="447" y="106" text-anchor="middle" fill="#8b949e" font-size="10">codificado, NO cifrado</text>
  <text x="447" y="126" text-anchor="middle" fill="#d2a8ff" font-family="'Courier New', monospace" font-size="13">dXNlcjpwYXNzd29yZA==</text>

  <line x1="588" y1="110" x2="638" y2="110" stroke="#f0883e" stroke-width="2"/>
  <polygon points="638,110 630,106 630,114" fill="#f0883e"/>

  <rect x="644" y="82" width="136" height="56" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="712" y="106" text-anchor="middle" fill="#8b949e" font-size="10">header</text>
  <text x="712" y="126" text-anchor="middle" fill="#79c0ff" font-family="'Courier New', monospace" font-size="12">Authorization</text>

  <!-- La vuelta -->
  <path d="M 447 148 L 447 176 L 135 176 L 135 196" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="135,196 131,188 139,188" fill="#f85149"/>
  <text x="291" y="170" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">base64 -d · sin ninguna clave, en dos segundos</text>

  <rect x="20" y="202" width="760" height="52" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="40" y="226" fill="#f85149" font-size="13" font-weight="bold">Por eso un Authorization: Basic en un log es la password en claro</text>
  <text x="40" y="244" fill="#8b949e" font-size="11">Un ticket, una captura de pantalla o un log de CI valen igual que la credencial</text>

  <line x1="20" y1="278" x2="780" y2="278" stroke="#30363d" stroke-width="1"/>

  <!-- Bien / mal -->
  <rect x="20" y="298" width="370" height="122" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="40" y="322" fill="#f85149" font-size="14" font-weight="bold">✗ Sin verificar el certificado</text>
  <text x="40" y="346" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">curl -k -u usuario:password \</text>
  <text x="40" y="363" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">  https://api.ejemplo.com/datos</text>
  <text x="40" y="390" fill="#f0f6fc" font-size="11">No sabes con quién hablas, y le mandas</text>
  <text x="40" y="407" fill="#f0f6fc" font-size="11">la password. Quien esté en medio la lee.</text>

  <rect x="410" y="298" width="370" height="122" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="430" y="322" fill="#3fb950" font-size="14" font-weight="bold">✓ Con la CA correcta</text>
  <text x="430" y="346" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">curl --cacert docs/lab-ca.pem \</text>
  <text x="430" y="363" fill="#8b949e" font-family="'Courier New', monospace" font-size="11">  -u user https://localhost:8443/...</text>
  <text x="430" y="390" fill="#f0f6fc" font-size="11">Si el certificado no valida, se le da la</text>
  <text x="430" y="407" fill="#f0f6fc" font-size="11">CA. Nunca se apaga la comprobación.</text>
</svg>
